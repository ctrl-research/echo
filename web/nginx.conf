server {
    # 8080 rather than 80: the unprivileged image runs as a non-root user, which
    # cannot bind a privileged port.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Single-page app: every route is served by index.html and resolved by the
    # client. Without this, refreshing on any path but / returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints these filenames, so a changed file is a changed URL and
    # the old one can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The entry point must not be cached: it is what points at the current
    # asset hashes, so a stale copy pins the client to a deleted build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
