name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "24"

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt required for: $unformatted"
            exit 1
          fi

      - name: Vet
        run: |
          go vet ./...
          go vet -tags integration ./...

      - name: Unit tests
        run: go test -race ./...

      # Generated code is committed, so a drift check catches a query edited
      # without regenerating.
      - name: Check sqlc output is current
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          git diff --exit-code -- internal/db/dbgen \
            || { echo "::error::sqlc output is stale; run 'make sqlc'"; exit 1; }

  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # testcontainers uses the Docker daemon preinstalled on the runner.
      #
      # -v plus a SKIP check because a skipped test still reports "ok". An
      # earlier version of the scanner suite shelled out to ffmpeg and skipped
      # when it was missing, so the whole suite silently passed without running
      # anything. Tests here must be hermetic; a skip is a failure.
      - name: Integration tests
        run: |
          set -o pipefail
          # -p 2: each package starts its own Postgres container, and running
          # four at once starves a modest runner into connection timeouts.
          go test -race -tags integration -timeout 15m -p 2 -v ./... 2>&1 | tee test.log
          # Leading whitespace allowed: Go indents subtest results, so an
          # anchored '^--- SKIP' silently misses a skipped subtest — the same
          # blind spot this guard exists to close.
          if grep -qE '^[[:space:]]*--- SKIP' test.log; then
            echo "::error::tests were skipped; integration tests must be hermetic"
            grep -E '^[[:space:]]*--- SKIP' test.log
            exit 1
          fi

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      # No codegen step any more. The client's types came from Echo's own
      # OpenAPI document, which meant generating the spec here and failing on
      # drift; they now come from Jellyfin's published spec, which is upstream
      # and moves on its own schedule. Regenerating it here would turn an
      # unrelated upstream release into a red build on an untouched branch, so
      # the committed output is the pinned version and `npm run gen:jellyfin`
      # updates it deliberately.

      # Explicit rather than implied by the build: tsc catches what vitest
      # cannot, since esbuild strips types without checking them. A required
      # field missing from a test fixture passed the suite green and failed
      # here.
      - name: Typecheck
        run: npx tsc -p tsconfig.app.json --noEmit
        working-directory: web

      # The player's queue logic is real logic and regresses like any other.
      # Shuffle in particular had a bug that only a test would have caught.
      - name: Client tests
        run: npm test
        working-directory: web

      - name: Build client
        run: npm run build
        working-directory: web

  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The client image is what actually gets deployed, so a break in its
      # Dockerfile or nginx config should fail here rather than on a merge to
      # main — Release is otherwise the first thing that ever builds it.
      - name: Build client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.client
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
