name: Release

# Publishes the container image to GHCR.
#
# Separate from ci.yml deliberately: CI builds the image on every pull request
# to prove it still builds, and must never push. This workflow only runs where
# pushing is correct — a merge to main, or a version tag.
#
# Every merge to main cuts a release. The next version is derived from the
# commits since the last v* tag — `feat:` moves the minor, anything else moves
# the patch — and the tag is created here rather than by hand, so the image
# always carries a real semver instead of a floating branch name. Pushing a v*
# tag manually still works and takes its version from the tag.
on:
  push:
    branches: [main]
    tags: ["v*"]
  # So a broken publish can be retried without an empty commit. Note this
  # consumes a version number: a dispatch on main cuts the next release.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  image:
    name: Publish image
    runs-on: ubuntu-latest
    permissions:
      # write, not read: this workflow creates the version tag it publishes.
      contents: write
      # Required for pushing to GHCR with GITHUB_TOKEN. Without it the push
      # fails with a 403 that reads like a credential problem.
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The version comes from the tag list and the commits since the most
          # recent one. Neither exists in the default shallow clone.
          fetch-depth: 0

      - name: Resolve the version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.ref_type }}" = "tag" ]; then
            # A hand-pushed tag already is the version. Nothing to compute,
            # and nothing to create.
            version="${GITHUB_REF_NAME#v}"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
          else
            latest=$(git tag -l 'v*' --sort=-v:refname | head -1)
            if [ -z "$latest" ]; then
              # First release. 0.1.0 rather than 0.0.1 because the deployment
              # already pins 0.1.0, and the first cut of a working service is
              # not a patch on nothing.
              version=0.1.0
            else
              IFS=. read -r major minor patch <<<"${latest#v}"
              log=$(git log --format='%B' "$latest..HEAD")

              if grep -qE '^(BREAKING CHANGE|BREAKING-CHANGE):' <<<"$log" \
                || grep -qE '^[a-z]+(\([^)]*\))?!:' <<<"$log"; then
                if [ "$major" -eq 0 ]; then
                  # Pre-1.0 a breaking change moves the minor. Declaring 1.0.0
                  # should be a deliberate act, not a side effect of how a
                  # commit message was written.
                  minor=$((minor + 1)); patch=0
                else
                  major=$((major + 1)); minor=0; patch=0
                fi
              elif grep -qE '^feat(\([^)]*\))?:' <<<"$log"; then
                minor=$((minor + 1)); patch=0
              else
                # Default to a patch rather than skipping the release. Not
                # every commit here is written as a conventional one, and a
                # merge to main that publishes nothing is the more confusing
                # outcome.
                patch=$((patch + 1))
              fi
              version="$major.$minor.$patch"
            fi
            echo "create_tag=true" >> "$GITHUB_OUTPUT"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major_minor=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "Publishing $version" >> "$GITHUB_STEP_SUMMARY"

      # arm64 is emulated only for the runtime stage; the Go build and the web
      # build run natively on the runner and cross-compile.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          # The version is resolved above for both trigger types, so it is
          # passed as a raw value rather than left to type=semver, which only
          # fires on a tag push.
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.major_minor }}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Echo
            org.opencontainers.image.description=Self-hosted music server with local library and YouTube streaming
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 and arm64 because the cluster pins neither, and a homelab is
          # as likely to be running Ampere or a Pi as an x86 box.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=v${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Off deliberately: attestations add extra entries to the image index,
          # and some Kubernetes tooling resolves the wrong one when selecting a
          # platform. A plain multi-arch index is the predictable choice.
          provenance: false
          sbom: false

      # The client on its own, as static files behind nginx. Published as a
      # second image rather than replacing the first: the standalone server is
      # still on main while the client is rebuilt against Jellyfin, and the two
      # need to be deployable independently. Shares this job so both carry the
      # same version.
      - id: meta-client
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}-client
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.major_minor }}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Echo Client
            org.opencontainers.image.description=PWA client for a Jellyfin music library
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.client
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Tag the release
        # After the image is pushed, not before: a failed build should not burn
        # a version number. Tags pushed with GITHUB_TOKEN do not trigger
        # workflows, so this cannot re-enter Release and build twice.
        if: steps.version.outputs.create_tag == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Pull with:"
            echo '```sh'
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.version.outputs.version }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
